[project]
name = "ai-image-reviewer"
version = "0.1.0"
description = "Local VLM-based PASS/REVIEW/FAIL sorter for generated images"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "Pillow>=10.0,<13",
  "requests>=2.31,<3",
  "watchdog>=4.0,<7",
  "Jinja2>=3.1,<4",
  "tqdm>=4.66,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
